[package]
name = "unim-windows"
version.workspace = true
edition = "2021"
description = "UNIM Korean IME - Windows standalone GUI"
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "unim-windows"
path = "src/main.rs"

[dependencies]
unim = { path = ".." }
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
