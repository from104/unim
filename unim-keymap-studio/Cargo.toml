[package]
name = "unim-keymap-studio"
version.workspace = true
edition = "2021"
description = "UNIM Keymap Studio - view and edit Hangul keymaps (GTK4)"
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "unim-keymap-studio"
path = "src/main.rs"

[dependencies]
unim = { path = ".." }
unim-keymap-common = { path = "../unim-keymap-common" }

gtk4 = { version = "0.9", features = ["v4_10"] }
libadwaita = { version = "0.7", features = ["v1_4"] }

dirs = "5"
serde_json = "1.0"
rust-i18n = "3"
