row_moachigi_chord_tooltip: "Treat keys pressed within N ms of the first keystroke as a chord. GUI slider: presets 0(OFF)/50/100/150/200ms; valid range 10–200ms (fine values via CLI). 60ms is the standard value; beginners should start at 100–150ms. 0 disables chord mode. Independent of bidirectional combine — chord-bundled jamo are auto-sorted by region and combined via permutation."

