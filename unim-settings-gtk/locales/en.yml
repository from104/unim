# ─────────────────────────────────────────────────────────────
# Live help — new tooltip keys (added in 0.2.0, all widgets)
# ─────────────────────────────────────────────────────────────

# General > Layouts and keymap
row_korean_layout_tooltip: "Lists 10 built-in layouts plus any v1 JSON profile under ~/.config/unim/layouts/. Selecting a layout rebuilds the option group below. AutoTypeFix forward correction also uses this layout as reference."
row_english_layout_tooltip: "AutoTypeFix uses this layout to infer English words from key sequences. Mismatched layout causes forward corrections to misfire. Default: QWERTY."
row_toggle_keys_tooltip: "Comma-separated XKB keysym names for Korean/English toggle. Examples: Korean, RightAlt, ShiftSpace. First key wins on collision."
row_hanja_keys_tooltip: "Comma-separated keys that open the Hanja/special-char popup. Examples: Hanja, F9. While composing Hangul: Hanja picker. When idle: emoji or special-char popup."

# General > Input mode
row_initial_mode_tooltip: "Mode right after daemon starts. English is the safe default — prevents Hangul in password fields at login. Switch to Korean if that's your primary typing mode."
row_mode_sharing_tooltip: "Per-window (recommended): each window keeps its own mode — terminal stays English, editor stays Korean. Global: one toggle switches all windows simultaneously."
row_commit_unit_tooltip: "Word accumulates the composition as preedit (underline) up to a word boundary, then commits it all at once. Smart (default) uses word unit only in apps listed in word-mode-apps and syllable unit everywhere else. It never applies to terminals or XIM, and always falls back to syllable unit while moachigi (chord input) is active."

# General > Auto English
row_auto_english_enable_tooltip: "Pressing Esc or '/' in Korean mode auto-switches to English — prevents accidental Hangul in vim normal mode or terminal commands. Recommended for vim/Emacs/terminal users. Password fields are unaffected."
row_auto_english_triggers_tooltip: "key:<Name>: matches XKB keysym code (e.g. key:Escape, key:F1). char:<chr>: matches the produced character — fires correctly on non-QWERTY layouts like Sebeolsik 390. Shift is ignored for char: — register both '/' and '?' separately if needed. Toggle key collision: toggle wins."

# TypeFix > Forward
row_typefix_forward_enable_tooltip: "Auto-replaces Korean-track Hangul with the intended Korean word at word boundaries while in English mode. Turn OFF for heavy English code writing (noisy). Keep ON for everyday writing and chat."
row_typefix_kor_threshold_tooltip: "Forward correction only runs after this many Hangul syllables accumulate. Default 2 recommended — lowering to 1 increases false positives; raising to 3+ misses short words."
row_typefix_forward_window_tooltip: "Only jamo entered within this recent window count as correction candidates. Too short misses slow typists; too long corrects stale input. 3–5s recommended."
row_typefix_skip_engword_tooltip: "Strongly recommended ON. Prevents intentional English words (e.g. 'for', 'git') from being flipped to Hangul. Turn OFF only for special layouts without an English dictionary."

# TypeFix > Reverse
row_typefix_reverse_enable_tooltip: "Auto-replaces Hangul jamo sequences that spell out an English word (e.g. git, kubectl). Useful for developers and researchers. Turn OFF for pure prose writing."
row_typefix_eng_threshold_tooltip: "Reverse only runs after this many Hangul characters accumulate. Default 3 recommended — values of 1–2 increase false positives on short inputs like 'ㅎ'."
row_typefix_reverse_window_tooltip: "Only jamo entered within this recent window count as reverse correction candidates. 3–5s recommended."
row_typefix_skip_complete_tooltip: "Strongly recommended ON. Prevents complete Hangul syllables ('가', '나') from being misread as English words. Turn OFF only for testing Sebeolsik uncomposed jamo correction."
row_typefix_userdict_tooltip: "ON: registered CLI commands (git, ls, kubectl) bypass length/dictionary checks for instant correction. OFF: auto-discovery mode. Manage entries on the 'User Dictionary' page."

# TypeFix > Master
row_typefix_master_tooltip: "E.g. typing 'gksrmf' in English mode by mistake → forward replaces with '한글'. ON enables both forward and reverse. OFF stops all auto-correction on this page."
row_typefix_retrigger_tooltip: "Recommended ON. Automatically adds re-triggered false positives to the Suppression List page. With OFF, you must add suppression words manually every time."
row_typefix_observe_window_tooltip: "If the same input is corrected again within this window, it is flagged as a false positive. Range 5–15s — fast typists: 5–7s; slow typists: 10–15s."
row_typefix_tentative_expiry_tooltip: "False-positive candidates not manually confirmed within this period are auto-deactivated. Range 1–12h — 1h balances learning accuracy and stale-entry cleanup."

# General > Display / IME
row_panel_indicator_tooltip: "Shows a Korean/English status icon (e.g. 'K'/'E') in the GNOME top panel. Turn OFF for a cleaner panel — check mode via the mode popup window instead."
row_show_notification_tooltip: "When ON, correction events and popup appearances briefly appear in the notification centre. Turn OFF if corrections are frequent and notifications become disruptive."
row_ime_enable_tooltip: "On Wayland, the GNOME Shell extension (unim-gnome-extension) intercepts key events and forwards them to unim-daemon. On X11, XIM handles this automatically — no effect."

