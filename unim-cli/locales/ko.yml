# ── blacklist 자식 서브커맨드 ────────────────────────────────────────────────
help_bl_list_about: "블랙리스트 항목 목록 표시"
help_bl_list_long: "AutoTypeFix 블랙리스트의 모든 항목을 상태·방향·ASCII 시퀀스·레이아웃 쌍과 함께 출력합니다."

help_bl_remove_about: "1-based 인덱스로 항목 제거"
help_bl_remove_long: "list 에서 보여준 1-based 인덱스로 항목을 제거합니다. 즉시 파일에 저장됩니다."
help_bl_remove_idx_short: "1-based 인덱스 (list 출력 기준)"
help_bl_remove_idx_long: "제거할 항목의 1-based 인덱스. 먼저 'blacklist list' 로 인덱스를 확인하세요."

help_bl_clear_about: "모든 블랙리스트 항목 삭제 (확인 필요)"
help_bl_clear_long: "블랙리스트 전체를 삭제합니다. 실행 전 확인 프롬프트가 표시됩니다. 되돌릴 수 없습니다."

help_bl_path_about: "블랙리스트 파일 경로 출력"
help_bl_path_long: "블랙리스트 파일의 절대 경로를 출력합니다.\n기본 경로: $XDG_CONFIG_HOME/unim/typefix-blacklist.yaml (보통 ~/.config/unim/typefix-blacklist.yaml)."

