# Help text — clap derive about/long_about/help/long_help
#
# 키 명명 규칙:
#   help_cli_*       : 최상위 unim-cli (변환 모드 + 공통 옵션)
#   help_cmd_*       : 1차 서브커맨드 (config, trigger)
#   help_cfg_*       : config 의 자식 서브커맨드 (show/set/path/reset/...)
#   help_ud_*        : config user-dict 자식 서브커맨드
#   help_layout_*    : config layout 자식 서브커맨드
