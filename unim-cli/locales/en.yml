blacklist_index_one_based: "Index must be 1-based (>=1)."
blacklist_index_out_of_range: "Index out of range (max %{max})."

# ── layout children ─────────────────────────────────────────────────────────
help_layout_list_about: "List builtin and user profile names"
help_layout_list_long: "List every profile name available — builtins plus those in\n~/.config/unim/layouts/. Names produced here are valid arguments for\ndescribe/validate."

help_layout_describe_about: "Show profile metadata, jamo mapping, and rule_set summary"
help_layout_describe_long: "Show metadata, jamo mapping, and a summary of combination rule_sets\nfor a given profile. Useful when authoring or reviewing a custom profile."
help_layout_describe_name_short: "Profile name (builtin alias or user-defined 'name')"
help_layout_describe_name_long: "Builtin alias (e.g. 2bul, 3bul390) or the 'name' field of a user profile JSON.\nUse 'unim-cli config layout list' to see available names."

help_layout_validate_about: "Validate profile schema, jamo, and rule_sets"
help_layout_validate_long: "Validate that a profile JSON file matches the schema, that all jamos resolve,\nand that active_rule_sets only refers to defined rule_sets.\n\nExit codes:\n  0  passed (no errors or warnings)\n  1  passed (warnings only)\n  2  errors — the daemon may fail to load this profile"
help_layout_validate_file_short: "Path to the JSON file to validate"
help_layout_validate_file_long: "Path to the profile JSON (relative or absolute).\nA missing file is treated as an error."

# ── blacklist children ──────────────────────────────────────────────────────
help_bl_list_about: "List blacklist entries"
help_bl_list_long: "Print all entries in the AutoTypeFix blacklist with their status,\ndirection, ASCII sequence, and layout pair."

help_bl_remove_about: "Remove entry by 1-based index"
help_bl_remove_long: "Remove the entry at the given 1-based index (as shown by 'list').\nThe file is saved immediately."
help_bl_remove_idx_short: "1-based index (from 'list')"
help_bl_remove_idx_long: "1-based index of the entry to remove. Use 'blacklist list' first to see indices."

help_bl_clear_about: "Clear all blacklist entries (with confirmation)"
help_bl_clear_long: "Delete all entries. A confirmation prompt is shown first. Cannot be undone."

help_bl_path_about: "Print the blacklist file path"
help_bl_path_long: "Print the absolute path of the blacklist file.\nDefault: $XDG_CONFIG_HOME/unim/typefix-blacklist.yaml (typically ~/.config/unim/typefix-blacklist.yaml)."

