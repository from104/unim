name: Linux CI

# develop/main push + PR 상시 게이트 — 빠른 회귀 검출이 목적.
# 릴리스 빌드(11 deb + SHA256SUMS)는 linux-deb.yml 담당 (태그 전용).
#
# paths-ignore 주의: 이전에는 'docs/**' 와 '**.md' 를 통째로 무시했다. 그 상태로는
# 도움말 드리프트 게이트(check-help-html)가 무의미하다 — docs/user/**.md 만 고친
# 푸시는 CI 자체가 안 돌아서, 재생성을 잊은 커밋이 그대로 통과한다.
# 그래서 도움말 산출물에 영향을 주는 경로(docs/user/**, help/**, tools/gen-help/**)는
# 무시 목록에서 뺐다. 도움말과 무관한 문서만 계속 무시한다.
# (GitHub Actions 는 YAML 앵커를 지원하지 않아 push/pull_request 에 목록을 중복 기재한다.)
on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'docs/dev/**'
      - 'docs/archive/**'
      - 'docs/user/keymaps/**'
      - '*.md'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'docs/dev/**'
      - 'docs/archive/**'
      - 'docs/user/keymaps/**'
      - '*.md'
  # 필요할 때 수동으로 돌린다 (입력 없음).
  workflow_dispatch:

# 같은 ref 에 새 push 가 오면 이전 실행은 취소 (게이트는 최신 커밋만 의미 있음).
concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 프로젝트 표준은 make build zero-warning (AGENTS.md 게이트와 동일 기준).
  # 릴리스 워크플로(linux-deb.yml)는 이미 태그된 코드를 그대로 빌드해야 하므로
  # 경고를 승격하지 않지만, 여기는 push/PR 게이트이므로 경고 = 실패다.
  RUSTFLAGS: -Dwarnings

jobs:
  build-test:
    name: Build (release + C frontends) & test
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (debian/control Build-Depends)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get build-dep -y .

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-ci   # linux-deb(릴리스)·windows-msvc 캐시와 분리
          cache-targets: true
          cache-on-failure: true

      - name: Popup CSS drift guard
        # popup_tokens.toml 수정 후 make gen-popup-css 미실행 커밋을 잡는다.
        run: make gen-popup-css-check

      - name: Offline help HTML drift guard
        # docs/user/**.md 수정 후 make help-html 미실행 커밋을 잡는다.
        run: make check-help-html

      - name: Build (make build — Rust release + GTK3/4·Qt5/6 IM modules)
        run: make build

      - name: Unit tests (cargo test --workspace)
        run: cargo test --workspace

  # 다음 LTS 를 미리 밟아 둔다. 24.04 에서 개발하고 26.04 에서 처음 돌려 보면
  # 시스템 라이브러리가 조용히 갈라진 것을 사용자 기계에서 알게 된다 —
  # 2026-08 에 GNOME 이 `Meta.is_wayland_compositor()` 를 없앴을 때가 그랬다.
  # 러너 이미지가 아니라 컨테이너를 쓰는 이유는, GitHub 이 새 LTS 러너를
  # 내주기 전부터 검사할 수 있어야 하기 때문이다.
  build-next-lts:
    name: Build on next LTS (ubuntu 26.04 container)
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 50
    steps:
      - name: Prepare container
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          # checkout 액션이 쓸 최소 도구. 컨테이너 이미지에는 없다.
          apt-get install -y --no-install-recommends git ca-certificates curl build-essential
          # build-dep 은 소스 저장소를 요구한다. 26.04 의 sources 는 deb822
          # 형식이라 옛 one-line 형식을 고치던 sed 로는 안 잡힌다.
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update -qq

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (debian/control Build-Depends)
        shell: bash
        run: |
          set -euo pipefail
          apt-get build-dep -y .

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-ci-next
          cache-targets: true
          cache-on-failure: true

      - name: Build (make build)
        run: make build

      - name: Unit tests (cargo test --workspace)
        run: cargo test --workspace

  # GNOME 확장 호환성 — 정적(check-gnome-api) + 동적(smoke-gnome-extension) 검사.
  # 둘 다 headless 로 설계돼 로그아웃 없이 CI 러너에서 그대로 돈다.
  # build-test 와 무관하게 필요한 시스템 패키지만 있으면 되므로 독립 job 으로 병렬 실행.
  check-compat:
    name: GNOME extension compatibility (static + smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNOME Shell / gjs / dbus (smoke-gnome-extension.sh 요구 패키지)
        # gjs           — check-gnome-api.js 실행기(정적 검사).
        # gnome-shell    — smoke-gnome-extension.sh 가 headless 로 띄우는 셸 자체.
        # dbus           — dbus-run-session 제공(세션 버스 격리, 실세션 버스와 무관).
        # gettext        — make gnome-extension 이 po/*.po 를 .mo 로 컴파일(msgfmt).
        # libglib2.0-bin — glib-compile-schemas(gschemas.compiled 생성).
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gjs gnome-shell dbus gettext libglib2.0-bin

      - name: 확장 설치 (사용자 홈 아래, sudo 불요 — smoke 스크립트가 찾는 경로)
        run: |
          set -euo pipefail
          make install-gnome-extension \
            GNOME_EXTENSION_DIR="$HOME/.local/share/gnome-shell/extensions/unim-gnome@from104.github.io"

      - name: make check-compat (check-gnome-api + smoke-gnome-extension)
        run: make check-compat

  # 기능 타이핑(L3) — 실제 GTK/Qt/XIM 경로로 XTEST 키를 넣어 한글이 조합·확정
  # 되는지 확인한다. 릴리스 매트릭스(linux-deb.yml/linux-rpm.yml)의 --smoke
  # 는 각 배포판 *컨테이너*에 설치된 .deb/.rpm 을 이 스크립트로 검증하고,
  # 여기는 사용자가 가장 흔히 만나는 조합 — 우분투 24.04 네이티브 러너 — 를
  # push/PR 마다 상시 검증한다. 패키지 빌드를 거치지 않고 `make install` 로
  # 더 빠르게 돈다. build-test 와 별개로 처음부터 다시 빌드한다 — 아티팩트를
  # 주고받는 복잡도보다 단순 병렬이 낫다.
  functional-x11:
    name: Functional typing (Xvfb, ubuntu-24.04 native)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (debian/control Build-Depends)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get build-dep -y .

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-ci-functional
          cache-targets: true
          cache-on-failure: true

      - name: Build (make build)
        run: make build

      - name: Install (PREFIX=/usr — GTK/Qt 가 보는 실제 배포 경로)
        run: sudo make install PREFIX=/usr

      - name: GTK3 immodules 캐시 갱신 (debian/unim-im-gtk.postinst 와 동일 — make install 은 트리거를 안 돈다)
        run: |
          set -euo pipefail
          command -v gtk-query-immodules-3.0 >/dev/null 2>&1 && sudo gtk-query-immodules-3.0 --update-cache || true

      - name: Install functional-test 런타임 도구 + XIM 테스트 앱 dev 헤더
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb x11-utils xdotool imagemagick dbus-x11 libxft-dev libfontconfig-dev

      - name: scripts/ci/functional-test.sh ubuntu24.04-native
        run: scripts/ci/functional-test.sh ubuntu24.04-native

      - name: Upload functional-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-ubuntu24.04-native
          path: functional-logs/functional-ubuntu24.04-native/
          if-no-files-found: warn
          retention-days: 14
