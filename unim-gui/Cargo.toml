[package]
name = "unim-gui"
version.workspace = true
edition = "2021"
description = "UNIM GUI — tray indicator + settings dialog (GTK4/libadwaita). popup은 unim-popup-service로 분리됨"
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "unim-gui"
path = "src/main.rs"

[dependencies]
# Core
unim = { path = ".." }
unim-gui-common = { path = "../unim-gui-common" }
unim-dbus = { path = "../unim-dbus" }
dirs = "5.0"

# Modern GTK4 UI (settings dialog)
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_4"] }

# System tray (StatusNotifierItem)
ksni = { version = "0.3", features = ["blocking"] }

# Async runtime for DBus
tokio = { version = "1", features = ["rt", "sync"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }

# Config serialization (for DBus set_config_yaml client call)
serde_yaml = "0.9"

# i18n (locales/{ko,en}.yml)
rust-i18n = "3"
