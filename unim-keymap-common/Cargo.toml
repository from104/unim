[package]
name = "unim-keymap-common"
version.workspace = true
edition = "2021"
description = "Shared widgets and state for UNIM keymap tools (studio + typing practice)"
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "unim_keymap_common"
path = "src/lib.rs"

[dependencies]
# Core profile/composer
unim = { path = ".." }
dirs = "5.0"

# UI
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_4"] }
cairo-rs = "0.20"

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# i18n (공유 라벨; 각 바이너리는 자기 locales도 따로 가짐)
rust-i18n = "3"
