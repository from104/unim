language = "C"
header = "/* UNIM Input Method C API - Auto-generated by cbindgen. Do not edit by hand. */"
include_guard = "UNIM_CAPI_H"
autogen_warning = "/* WARNING: This file is auto-generated by `cargo build`. DO NOT MODIFY. */"
tab_width = 4
style = "type"
cpp_compat = true
documentation = true
documentation_style = "doxy"

[export]
include = [
    "InputResult",
    "InputCategory",
    "ModifierState",
    "ModeSharingMode",
    "UnimStr",
    "CPopupKeyResult",
]

[export.rename]
"InputResult" = "UnimInputResult"
"InputCategory" = "UnimInputCategory"
"ModifierState" = "UnimModifierState"
"ModeSharingMode" = "UnimModeSharingMode"
"CPopupKeyResult" = "UnimPopupKeyResult"
# Opaque handles — keep the Unim* names existing GTK/Qt frontends rely on.
"Config" = "UnimConfig"
"InputEngine" = "UnimEngine"
"PopupState" = "UnimPopupState"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = true
include = ["unim"]

[struct]
rename_fields = "None"
