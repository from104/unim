[package]
name = "unim-indicator"
version.workspace = true
edition = "2021"
description = "UNIM tray indicator (GTK4 + StatusNotifierItem). 트레이 책임 전용 프로세스 — 설정 GUI는 unim-settings, popup은 unim-popup-service가 담당."
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "unim-indicator"
path = "src/main.rs"

[dependencies]
# Core
unim = { path = ".." }
unim-gui-common = { path = "../unim-gui-common" }
unim-dbus = { path = "../unim-dbus" }

# GTK4 메인 루프 (트레이 백그라운드 호스트)
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_4"] }

# System tray (StatusNotifierItem)
ksni = { version = "0.3", features = ["blocking"] }

# Async runtime for DBus
tokio = { version = "1", features = ["rt", "sync"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }

# i18n (locales/{ko,en}.yml)
rust-i18n = "3"
