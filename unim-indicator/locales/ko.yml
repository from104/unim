row_ime_enable_tooltip: "Wayland 세션에서 GNOME Shell 확장(unim-gnome-extension)이 키 이벤트를 가로채 unim-daemon에 전달합니다. X11 세션에서는 XIM이 자동으로 동작하므로 영향 없음."

