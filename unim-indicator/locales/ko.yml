# 일반 > 자판 및 키맵
row_korean_layout_tooltip: "내장 자판 10종 + ~/.config/unim/layouts/*.json 의 사용자 자판이 표시됩니다. 선택 시 아래 옵션 그룹이 해당 자판 규칙으로 재구성됩니다. AutoTypeFix 순방향 교정도 이 자판 기준."
row_english_layout_tooltip: "AutoTypeFix가 영문 단어를 추론할 때 기준이 되는 자판. 실제 사용 중인 영어 자판과 다르면 순방향 교정이 오작동합니다. 기본값: QWERTY."
row_toggle_keys_tooltip: "한/영 전환 키를 쉼표로 구분해 입력합니다. 예: Korean, RightAlt, ShiftSpace. 키 이름은 xkb 키심(keysym) 기준. 충돌 시 첫 번째 키 우선."
row_hanja_keys_tooltip: "한자/특수문자 팝업을 띄울 키를 쉼표로 구분해 입력합니다. 예: Hanja, F9. 한글 조합 중이면 한자 변환, 조합이 없으면 이모지 팝업 또는 특수문자 팝업."

# 일반 > 입력 모드
row_initial_mode_tooltip: "데몬 시작 직후 모드. 「영문」이 안전한 기본값 — 로그인 시 비밀번호 필드 등에서 한글 입력 방지. 한글 작업이 주된 경우 「한글」로 변경 가능."
row_mode_sharing_tooltip: "창별 독립(PerApp) 권장: 터미널은 영문 유지, 에디터·메신저는 한글 유지. 전역 공유(Global)는 모든 창이 한 번에 같이 전환 — 모드 혼란이 잦으면 PerApp으로."

# 일반 > 자동 영문 전환
row_auto_english_enable_tooltip: "vim/Emacs/터미널에서 Esc나 '/'를 눌렀을 때 한글 모드가 자동으로 영문으로 전환됩니다. 한글 입력 중 명령어를 치다 실수하는 패턴을 방지. 비밀번호 필드는 이미 강제 영문이라 영향 없음."
row_auto_english_triggers_tooltip: "key:<이름>: XKB keysym 코드 비교 (예: key:Escape, key:F1). char:<문자>: 실제 산출 문자 비교 — 세벌식390 등 비-QWERTY 자판에서도 '/'가 정상 발동. Shift 무관이므로 '/'와 '?'를 구분하려면 둘 다 등록. 한/영 토글 키와 겹치면 토글이 우선."

# 오타 교정 > 순방향
row_typefix_forward_enable_tooltip: "영문 모드에서 한글 자모가 누적되면 단어 경계 시점에 한글로 자동 교체. 영문 코드 작성 중 노이즈가 많으면 OFF 권장. 일상 글쓰기·채팅은 ON이 편합니다."
row_typefix_kor_threshold_tooltip: "이 개수 이상의 한글 음절이 쌓여야 순방향 교정 검사를 시작합니다. 기본값 2 권장 — 1로 줄이면 오탐 증가, 3 이상이면 짧은 단어 미감지."
row_typefix_forward_window_tooltip: "입력 후 이 시간 내에 들어온 자모만 교정 후보로 삼습니다. 너무 짧으면 느린 타이핑이 누락, 너무 길면 오래된 입력이 교정됨. 3~5초 권장."
row_typefix_skip_engword_tooltip: "ON 강력 권장. 영문 단어(예: 'for', 'git')를 의도적으로 쳤는데 한글로 교체되는 사고를 막습니다. OFF는 영문 사전 없는 특수 자판용."

# 오타 교정 > 역방향
row_typefix_reverse_enable_tooltip: "한글 모드에서 영어 식별자(예: git, kubectl)나 영단어가 자동으로 영문으로 교체됩니다. 개발자·연구자에게 유용. 일반 문서 작성만 하면 OFF 권장."
row_typefix_eng_threshold_tooltip: "이 개수 이상의 한글 글자가 쌓여야 역방향 교정 검사를 시작합니다. 기본값 3 권장 — 1~2이면 짧은 단어(예: 'ㅎ') 오탐 증가."
row_typefix_reverse_window_tooltip: "입력 후 이 시간 내에 들어온 자모만 역방향 교정 후보로 삼습니다. 3~5초 권장."
row_typefix_skip_complete_tooltip: "ON 강력 권장. 완성된 한글 음절('가', '나')이 우연히 영어 단어로 해석되는 오탐을 방지합니다. OFF는 세벌식 미조합 자모 교정 테스트용."
row_typefix_userdict_tooltip: "ON: 등록된 CLI 명령어(git, ls, kubectl 등)는 길이·사전 검사를 건너뛰고 즉시 교정. OFF: 사전 자동 발견 우선. '사용자 사전' 페이지에서 단어 관리."

# 오타 교정 > 마스터
row_typefix_master_tooltip: "예: 영문 모드인 줄 모르고 'gksrmf'를 친 경우 → 순방향(forward)이 '한글'로 자동 교체. ON이면 순방향·역방향 모두 활성. OFF면 이 페이지의 모든 교정이 멈춥니다."
row_typefix_retrigger_tooltip: "ON 권장. 오탐이 자주 발생하는 단어를 자동으로 '교정 억제 단어' 페이지에 추가합니다. OFF면 매번 수동으로 단어를 등록해야 합니다."
row_typefix_observe_window_tooltip: "교정 직후 이 시간 내에 동일 입력이 다시 교정되면 오탐으로 판정합니다. 5~15초 범위 — 빠른 타자는 5~7초, 느린 타자는 10~15초 권장."
row_typefix_tentative_expiry_tooltip: "오탐 후보로 기록된 단어는 이 시간 내 수동 확정하지 않으면 자동 비활성화됩니다. 1~12시간 범위 — 1시간이 학습 정확도와 만료 속도의 균형점."

