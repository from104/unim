[package]
name = "unim"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dirs = "5.0"
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
x11 = "2.18.2"
libc = "0.2"

[lib]
name = "unim"
path = "src/lib.rs"

[workspace.package]
version = "0.3.0"
# Cargo.lock v4 (used by this workspace) requires Rust 1.78+.
# Older toolchains will fail with "lock file version 4 requires a newer Cargo".
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/from104/unim"
authors = ["from104 <from104@github.com>"]

[workspace]
members = [
    "unim-cli",
    "unim-capi",
    "unim-frontends/xim",
    "unim-frontends/wayland",
    "unim-daemon",
    "unim-gui-common",
    "unim-popup-types",
    "unim-indicator",
    "unim-settings",
    "unim-popup-service",
    "unim-keymap-common",
    "unim-keymap-studio",
    "unim-typing-practice",
    "unim-dbus",
    "unim-tsf",
    "tests/unim-test-wayland",
    "tests/unim-test-dbus",
]
resolver = "2"
