[package]
name = "unim"
version.workspace = true
edition = "2021"

[dependencies]
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dirs = "5.0"
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
x11 = "2.18.2"
libc = "0.2"

[lib]
name = "unim"
path = "src/lib.rs"

[workspace.package]
version = "0.2.0"

[workspace]
members = [
    "unim-cli",
    "unim-capi",
    "unim-frontends/xim",
    "unim-frontends/wayland",
    "unim-daemon",
    "unim-gui-common",
    "unim-gui-gtk",
    "unim-gui-qt",
    "unim-dbus",
    "unim-windows",
    "unim-tsf",
    "tests/unim-test-wayland",
    "tests/unim-test-dbus",
]
resolver = "2"
