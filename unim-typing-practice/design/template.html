<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>UNIM 타자 연습 — 디자인 재설계</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Inter", -apple-system, "Segoe UI", sans-serif;
    background: #0f0f10;
    color: #ededed;
    min-height: 100vh;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes tri-flip {
    0%   { transform: rotateX(0deg); }
    100% { transform: rotateX(360deg); }
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel">
const { useState } = React;

function App() {
  return (
    <DesignCanvas title="UNIM 타자 연습 — 현대적 재설계" subtitle="GTK4 + libadwaita · 라이트 / 다크">
      <DCSection id="practice" title="Practice 페이지 · 메인 화면">
        <DCArtboard id="practice-light" label="라이트 모드" width={900} height={755}>
          <WindowChrome tokens={tokensLight} dark={false} view="practice" height={755}>
            <PracticePage tokens={tokensLight} dark={false} />
          </WindowChrome>
        </DCArtboard>
        <DCArtboard id="practice-dark" label="다크 모드" width={900} height={755}>
          <WindowChrome tokens={tokensDark} dark={true} view="practice" height={755}>
            <PracticePage tokens={tokensDark} dark={true} />
          </WindowChrome>
        </DCArtboard>
      </DCSection>

      <DCSection id="result" title="Result 페이지 · 세션 요약 + 오타 히트맵">
        <DCArtboard id="result-light" label="결과 · 라이트" width={900} height={820}>
          <WindowChrome tokens={tokensLight} dark={false} view="result">
            <ResultPage tokens={tokensLight} dark={false} />
          </WindowChrome>
        </DCArtboard>
        <DCArtboard id="result-dark" label="결과 · 다크" width={900} height={820}>
          <WindowChrome tokens={tokensDark} dark={true} view="result">
            <ResultPage tokens={tokensDark} dark={true} />
          </WindowChrome>
        </DCArtboard>
        <DCArtboard id="result-empty" label="빈 상태" width={900} height={820}>
          <WindowChrome tokens={tokensLight} dark={false} view="result">
            <ResultPage tokens={tokensLight} dark={false} empty />
          </WindowChrome>
        </DCArtboard>
      </DCSection>

      <DCSection id="headers" title="헤더바 · 메뉴 / 지문 드롭다운">
        <DCArtboard id="header-corpus" label="지문 드롭다운" width={900} height={300}>
          <WindowChrome tokens={tokensLight} dark={false} view="practice" showCorpusDropdown>
            <div style={{ padding: 20, color: tokensLight.fgFaint, fontSize: 12 }}>...</div>
          </WindowChrome>
        </DCArtboard>
        <DCArtboard id="header-menu" label="앱 메뉴" width={900} height={300}>
          <WindowChrome tokens={tokensLight} dark={false} view="practice" showMenu>
            <div style={{ padding: 20, color: tokensLight.fgFaint, fontSize: 12 }}>...</div>
          </WindowChrome>
        </DCArtboard>
      </DCSection>

      <DCSection id="keys" title="키맵 · 상태 / 4-corner 라벨 / 특수 키">
        <DCArtboard id="key-states-light" label="키 상태 · 라이트" width={620} height={720}>
          <KeyStatesShowcase tokens={tokensLight} dark={false} />
        </DCArtboard>
        <DCArtboard id="key-states-dark" label="키 상태 · 다크" width={620} height={720}>
          <KeyStatesShowcase tokens={tokensDark} dark={true} />
        </DCArtboard>
      </DCSection>

      <DCSection id="dialog" title="데몬 비활성 다이얼로그 · 단계별 안내">
        <DCArtboard id="dialog-light" label="라이트" width={520} height={560}>
          <div style={{ padding: 40, background: tokensLight.bg, height: "100%", display: "grid", placeItems: "center" }}>
            <DaemonDialog tokens={tokensLight} dark={false} variant="stepped" />
          </div>
        </DCArtboard>
        <DCArtboard id="dialog-dark" label="다크" width={520} height={560}>
          <div style={{ padding: 40, background: tokensDark.bg, height: "100%", display: "grid", placeItems: "center" }}>
            <DaemonDialog tokens={tokensDark} dark={true} variant="stepped" />
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="color" title="색 · 접근성 가이드">
        <DCArtboard id="color-light" label="라이트" width={600} height={640}>
          <ColorAccessCard tokens={tokensLight} dark={false} />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
