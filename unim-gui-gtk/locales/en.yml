# General > Layouts and keymap (NEW subtitle)
row_english_layout_subtitle: "QWERTY is the default. Change only if you use Dvorak / Colemak / Colemak-DH / Workman."

# General > Input mode (NEW subtitle)
row_initial_mode_subtitle: "Whether the daemon starts in Korean or English mode."
row_mode_sharing_subtitle: "Per-window: each window keeps its own mode. Global: switching once syncs everywhere."

# General > Auto English (NEW subtitle)
row_auto_english_enable_subtitle: "Forces English mode when a trigger key is pressed in Korean mode."

# TypeFix > forward / reverse (NEW subtitle for enable rows)
row_typefix_forward_enable_subtitle: "Auto-replaces with the Korean track's word at word boundaries while in English mode."
row_typefix_reverse_enable_subtitle: "When the Korean track yields a recognizable English word, replaces it at the word boundary."

# TypeFix > Master (NEW row subtitle, distinct from group description)
row_typefix_master_row_subtitle: "When OFF, both forward and reverse stop."

# GNOME / Display / IME (NEW subtitle)
row_panel_indicator_subtitle: "Shows the Korean/English mode icon in the top panel."
row_show_notification_subtitle: "Shows brief notifications when correction or popup events fire."
row_ime_enable_subtitle: "On Wayland, the GNOME extension intercepts keys and forwards them to unim-daemon."

# ─────────────────────────────────────────────────────────────
# Live help — new tooltip keys (added in 0.2.0, all widgets)
# ─────────────────────────────────────────────────────────────

# General > Layouts and keymap
row_korean_layout_tooltip: "Lists 10 built-in layouts plus any v1 JSON profile in ~/.config/unim/layouts/. Selection redraws the option group below."
row_english_layout_tooltip: "AutoTypeFix uses this layout when inferring English words; mismatched layouts cause forward corrections to misfire."
row_emoji_popup_tooltip: "When OFF, colon strings are typed verbatim. Turn OFF if you write code with frequent colon collisions."
row_toggle_keys_tooltip: "Comma-separated list of keys used to toggle Korean/English mode. Examples: Korean, RightAlt, ShiftSpace."
row_hanja_keys_tooltip: "Comma-separated list of keys that open the Hanja popup. Examples: Hanja, F9."

# General > Input mode
row_initial_mode_tooltip: "English is the safe default. Korean is fine if you primarily type Korean."
row_mode_sharing_tooltip: "Per-window (recommended) keeps the terminal in English while the editor stays in Korean. Pick global to enforce one mode everywhere."

# General > Auto English
row_auto_english_enable_tooltip: "Recommended for vim/Emacs/terminal users. Password fields are unaffected (already English-only)."
row_auto_english_triggers_tooltip: "char:<chr> matches the produced character regardless of Korean layout (so '/' fires on Sebeolsik 390 too). Shift is ignored for char: triggers — register both '/' and '?' if you want them separately. If a trigger key collides with the Hangul toggle, the toggle wins."

# TypeFix > Forward
row_typefix_forward_enable_tooltip: "Turn OFF if you write a lot of English code (noisy). Leave ON for everyday writing."
row_typefix_kor_threshold_tooltip: "Forward only runs after this many Korean syllables accumulate. Lower values mean more aggressive (and noisier) correction."
row_typefix_forward_window_tooltip: "Only jamo received within this recent input window count as candidates. Shorter is conservative, longer is aggressive."
row_typefix_skip_engword_tooltip: "Recommended ON. Prevents intentionally-typed English from being flipped to Korean."

# TypeFix > Reverse
row_typefix_reverse_enable_tooltip: "Useful for users who interleave English identifiers in Korean text (developers, researchers)."
row_typefix_eng_threshold_tooltip: "Reverse only runs after this many Korean characters accumulate — guards against short-word false positives."
row_typefix_reverse_window_tooltip: "Only jamo received within this recent input window count as reverse candidates."
row_typefix_skip_complete_tooltip: "Recommended ON. Prevents partially composed jamos from being misread as English words."
row_typefix_userdict_tooltip: "ON for precision, OFF for auto-discovery. Manage entries on the 'User Dictionary' page."

# TypeFix > Master
row_typefix_master_tooltip: "E.g. typing 'gksrmf' in English mode by mistake → forward replaces with '한글'. With master OFF, that auto-correction stops."
row_typefix_retrigger_tooltip: "Recommended ON. With OFF, you must add suppression words manually in the GUI."
row_typefix_observe_window_tooltip: "Range 5–15s. Shorter is conservative, longer is sensitive. Fast typists: 5–7."
row_typefix_tentative_expiry_tooltip: "Range 1–12h. Longer means more learning chance but stale entries linger. 1h is the sweet spot."

# General > Display / IME
row_panel_indicator_tooltip: "Turn OFF for a cleaner panel; rely on the mode popup to check status."
row_show_notification_tooltip: "When ON, key events such as a correction briefly appear in the notification centre."
row_ime_enable_tooltip: "Lets the GNOME extension forward key events to unim-daemon on Wayland. No effect on X11."

