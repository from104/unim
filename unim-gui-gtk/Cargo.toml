[package]
name = "unim-gui-gtk"
version.workspace = true
edition = "2021"
description = "UNIM GUI - Integrated tray, popups, and settings"

[[bin]]
name = "unim-gui-gtk"
path = "src/main.rs"

[dependencies]
# Core
unim = { path = ".." }
unim-gui-common = { path = "../unim-gui-common" }
dirs = "5.0"

# System tray (StatusNotifierItem)
ksni = { version = "0.3", features = ["blocking"] }

# Modern GTK4 UI (popup window)
gtk4 = "0.9"
gdk4-x11 = { version = "0.9", optional = true }
gtk4-layer-shell = { version = "0.4", optional = true }
libadwaita = { version = "0.7", features = ["v1_4"] }

# X11 direct access (override-redirect)
x11 = { version = "2.21", features = ["xlib"], optional = true }

# Async runtime for DBus
tokio = { version = "1", features = ["rt", "sync"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }

# Config serialization (for DBus set_config_yaml client call)
serde_yaml = "0.9"

# unim-dbus proxy (client)
unim-dbus = { path = "../unim-dbus" }

# i18n (locales/{ko,en}.yml; LANG/LC_ALL 자동 감지)
rust-i18n = "3"

[features]
default = ["gdk4-x11", "x11"]
wayland = ["gtk4-layer-shell"]
