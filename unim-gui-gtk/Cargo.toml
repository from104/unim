[package]
name = "unim-gui-gtk"
version.workspace = true
edition = "2021"
description = "UNIM Settings GUI (GTK4/libadwaita) — popup/tray는 unim-popup-service로 이관됨"
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "unim-gui-gtk"
path = "src/main.rs"

[dependencies]
# Core
unim = { path = ".." }
unim-gui-common = { path = "../unim-gui-common" }
dirs = "5.0"

# Modern GTK4 UI (settings dialog)
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_4"] }

# Config serialization (for DBus set_config_yaml client call)
serde_yaml = "0.9"

# unim-dbus proxy (client)
unim-dbus = { path = "../unim-dbus" }

# i18n (locales/{ko,en}.yml)
rust-i18n = "3"
