[package]
name = "unim-wayland"
version.workspace = true
edition = "2021"
description = "UNIM Wayland Input Method Frontend"
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "unim-wayland"
path = "src/main.rs"

[dependencies]
unim = { path = "../.." }
unim-dbus = { path = "../../unim-dbus" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["staging", "unstable", "client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.8", features = ["wayland"] }
tokio = { version = "1", features = ["rt", "sync"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
mio = { version = "1", features = ["os-poll"] }
nix = { version = "0.29", features = ["time", "fs", "mman"] }
futures-util = "0.3"
