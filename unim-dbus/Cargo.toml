[package]
name = "unim-dbus"
version.workspace = true
edition = "2021"
description = "UNIM DBus IPC Library"
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "unim_dbus"
path = "src/lib.rs"

[dependencies]
# Core UNIM library
unim = { path = ".." }
# Popup DBus payload 공유 타입 (popup-service / GNOME ext 도 동일하게 의존)
unim-popup-types = { path = "../unim-popup-types" }

# DBus with async support
zbus = { version = "4", default-features = false, features = ["tokio"] }

# DBus 시그널 스트림 소비 (NameOwnerChanged 구독)
futures-util = "0.3"

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Logging
log = "0.4"


[dev-dependencies]
# 순서 시험(tests/surrounding_order.rs) — peer-to-peer 연결로 버스 데몬 없이 서버/클라이언트 구성
zbus = { version = "4", default-features = false, features = ["tokio", "p2p"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tempfile = "3"
